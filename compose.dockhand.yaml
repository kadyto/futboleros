# Pegar como stack en Dockhand. No requiere clonar el repositorio ni configurar rutas.
services:
  futboleros:
    build:
      context: https://github.com/kadyto/futboleros.git#main
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8093}:8000"
    environment:
      TZ: Europe/Madrid
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD con al menos 12 caracteres en las variables del stack}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    volumes:
      - futboleros_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 15s

volumes:
  futboleros_data:
